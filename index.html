  <title>CitySport HOME</title>

<body>
  <header>
    <div class="menu">
      <hr class="line-1">
      <hr class="line-2">
    </div>

    <img src="./logo.png" class="citysport-logo">

    <div class="lang-cart">
      <select>
        <option value="french">FR | CM</option>
        <option value="english">ENG | CM</option>
      </select>
      <img src="./shopping-bag (1).svg">
    </div>
  </header>

  <section class="section-1">
    <div>
      <h1>
        DROP <br> OF THE <br> MONTH
      </h1>

      <div class="container">
        <div class="shoes-n-directions">
          <svg>

          <img class="current-image" src="./nuiOW9EfXcD0092kmo9TkKIZNe4x2bG1j5kUug5y 1.png">
          <svg>
            <use href="./sprite.svg#chevron-right"></use>
          </svg>
        </div>
        <div class="shoe-name-color">
          <h3>SUPERSTAR II</h3>
          <h4>Core Black</h4>
        </div>
      </div>
    </div>

    <div class="carousel">
      <!-- the top group handles the overflow while the inner group handles the animation -->
      <div class="logos">
        <img src="./new_balance.jpg">
        <img src="./nike.jpg">
        <img src="lacoste.jpg">
        <img src="puma.jpg">
        <img src="adidas.jpg">
        <img src="under armour.jpg">
        <img src="levi's.jpg">
        <img src="calvin_klein.jpg">
        <img src="converse.jpg">
        <img src="tommy_hilfiger.jpg">
      </div>
      <!-- duplicate -->
      <div class="logos">
        <img src="./new_balance.jpg">
        <img src="./nike.jpg">
        <img src="lacoste.jpg">
        <img src="puma.jpg">
        <img src="adidas.jpg">
        <img src="under armour.jpg">
        <img src="levi's.jpg">
        <img src="calvin_klein.jpg">
        <img src="converse.jpg">
        <img src="tommy_hilfiger.jpg">
      </div>
    </div>
  </section>

  <section class="section-2">
    <div>
      <p>Cette Saison</p>
      <h2>Decouvrez<br>votre style</h2>
      <button>S'abonner</button>
      <img>
    </div>
  </section>

  <section class="section-3">
    <h1>COLLECTION</h1>
    <div>
      <div>
        <img class="img" src="./Homme.png">
        <p>HOMME</p>
        <button>Visiter</button>
      </div>

      <div>
        <img class="img" src="femme.png">
        <p>FEMME</p>
        <button>Visiter</button>
      </div>

      <div>
        <img class="img" src="enfant.png">
        <p>ENFANT</p>
        <button>Visiter</button>
      </div>
    </div>
  </section>

  <footer>
    <div class="contact">
      <h1>CONTACT</h1>
      <div class="contact-info">
        <div>
          <svg>
            <use href="./sprite.svg#location-icon"></use>
          </svg>
          <p>Yaounde</p>
        </div>

        <div>
          <svg>
            <use href="./sprite.svg#location-icon"></use>
          </svg>
          <p>Douala</p>
        </div>

        <div>
          <svg>
            <use href="./sprite.svg#envelop-icon"></use>
          </svg>
          <p>admin_city@citysportcmr.com</p>
        </div>
      </div>

      <div class="socials">
        <svg>
          <use href="./sprite.svg#instagram-icon"></use>
        </svg>
        <svg>
          <use href="sprite.svg#facebook-icon"></use>
        </svg>
        <svg>
          <use href="sprite.svg#twitter-icon"></use>
        </svg>
      </div>
    </div>

    <form>
      <div>
        <input type="text" placeholder="Nom">
      </div>

      <div>
        <input type="text" placeholder="+237 | Numero de telephone">
      </div>

      <div>
        <input type="email" placeholder="Email">
      </div>

      <button>Envoyer</button>
    </form>
  </footer>
